name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Check formatting and lint
        run: uv run --frozen ruff format --check . && uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen ty check src tests

      - name: Run unit tests
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: uv run --frozen python tests/test_review.py

      - name: Run Docker isolation test
        env:
          PYDANTIC_AI_NO_BANNER: "1"
          RUN_DOCKER_TESTS: "1"
        run: uv run --frozen python tests/test_review.py DockerSandboxTest
