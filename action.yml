name: Pydantic AI PRレビュー
description: Pydantic AI経由のGeminiと分離されたDockerサンドボックスでPull Requestをレビューします。
author: ynufes-tech

branding:
  icon: search
  color: blue

inputs:
  gemini-api-key:
    description: Pydantic AIのオーケストレーターが使用するGemini APIキー。
    required: true
  model:
    description: 使用するGeminiモデル名。
    required: false
    default: gemini-3.8-flash
  review-language:
    description: モデルが生成する要約・指摘・評価などの言語。Action固定の表示文は日本語。
    required: false
    default: 日本語
  repository:
    description: owner/name形式の対象リポジトリ。
    required: true
  pull-request-number:
    description: レビュー対象のPull Request番号。
    required: true
  base-sha:
    description: Pull RequestのBaseコミットSHA。
    required: true
  head-sha:
    description: Pull RequestのHeadコミットSHA。
    required: true
  source-directory:
    description: Pull Requestと完全なGit履歴を含むcheckoutディレクトリ。
    required: false
    default: .
  sandbox-image:
    description: カスタムDockerイメージ。未指定時はpnpm・actionlintを含む既定イメージを構築します。
    required: false
    default: ""
  sandbox-network:
    description: noneは通信禁止、publicは公開HTTP(S)通信を許可。ホスト・プライベート網への通信は拒否します。
    required: false
    default: none
  mcp-servers:
    description: 外部文書・Issueの参照に使うHTTPS MCPサーバーのJSON配列。接続先・説明・許可する読み取りツールを指定します。
    required: false
    default: "[]"
  mcp-headers:
    description: MCPサーバー名をキーにしたHTTPヘッダーのJSON。認証情報はSecretsから渡し、サンドボックスには渡しません。
    required: false
    default: "{}"
  request-limit:
    description: 出力検証の再試行を含むモデルリクエストの上限（最大80）。
    required: false
    default: "80"
  tool-call-limit:
    description: ツール呼び出しの上限（最大30）。
    required: false
    default: "30"
  investigation-tool-limit:
    description: 最終結果の生成余力を残すため、プロンプトでモデルに指示する調査ツールの上限（最大24）。
    required: false
    default: "24"

outputs:
  report:
    description: 観測・根拠付き評価・指摘を含む検証済みJSON（schema_version 2）。
    value: ${{ steps.review.outputs.report }}

runs:
  using: composite
  steps:
    - name: uvをインストール
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock

    - name: 依存関係をインストール
      shell: bash
      run: uv sync --frozen --no-dev --project "$GITHUB_ACTION_PATH"

    - name: レビュー用Dockerイメージを準備
      id: sandbox
      shell: bash
      env:
        CUSTOM_IMAGE: ${{ inputs.sandbox-image }}
        SANDBOX_NETWORK: ${{ inputs.sandbox-network }}
      run: |
        set -euo pipefail
        if [[ "$SANDBOX_NETWORK" != "none" && "$SANDBOX_NETWORK" != "public" ]]; then
          echo "::error::sandbox-network は none または public を指定してください。"
          exit 1
        fi
        image="$CUSTOM_IMAGE"
        if [[ -z "$image" ]]; then
          image="ai-review-sandbox:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          docker build --tag "$image" "$GITHUB_ACTION_PATH/sandbox"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Pull Requestをレビュー
      id: review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        PYDANTIC_AI_NO_BANNER: "1"
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_LANGUAGE: ${{ inputs.review-language }}
        REVIEW_REPOSITORY: ${{ inputs.repository }}
        REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        REVIEW_BASE_SHA: ${{ inputs.base-sha }}
        REVIEW_HEAD_SHA: ${{ inputs.head-sha }}
        REVIEW_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        REVIEW_SANDBOX_IMAGE: ${{ steps.sandbox.outputs.image }}
        REVIEW_SANDBOX_NETWORK: ${{ inputs.sandbox-network }}
        REVIEW_MCP_SERVERS: ${{ inputs.mcp-servers }}
        REVIEW_MCP_HEADERS: ${{ inputs.mcp-headers }}
        REVIEW_REQUEST_LIMIT: ${{ inputs.request-limit }}
        REVIEW_TOOL_CALL_LIMIT: ${{ inputs.tool-call-limit }}
        REVIEW_INVESTIGATION_TOOL_LIMIT: ${{ inputs.investigation-tool-limit }}
      run: exec "$GITHUB_ACTION_PATH/.venv/bin/python" "$GITHUB_ACTION_PATH/src/review.py"
